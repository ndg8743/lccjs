<!DOCTYPE html>
<html lang="en" class="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LCC.js - JavaScript-based Assembler and Interpreter</title>
  
  <!-- CodeMirror -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/6.65.7/codemirror.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/6.65.7/codemirror.min.js"></script>
  
  <!-- Our bundled scripts -->
  <script src="./dist/bundle.js" defer></script>
  <script src="./dist/app.js" type="module" defer></script>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            primary: {
              50: '#f0f9ff',
              100: '#e0f2fe',
              200: '#bae6fd',
              300: '#7dd3fc',
              400: '#38bdf8',
              500: '#0ea5e9',
              600: '#0284c7',
              700: '#0369a1',
              800: '#075985',
              900: '#0c4a6e',
              950: '#082f49',
            },
            secondary: {
              50: '#f8fafc',
              100: '#f1f5f9',
              200: '#e2e8f0',
              300: '#cbd5e1',
              400: '#94a3b8',
              500: '#64748b',
              600: '#475569',
              700: '#334155',
              800: '#1e293b',
              900: '#0f172a',
              950: '#020617',
            },
          },
        },
      },
    }
  </script>
  
  <!-- Font Awesome for icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body class="bg-secondary-900 text-secondary-100 min-h-screen">
  <!-- React Application Root -->
  <div id="react-root"></div>
  
  <!-- Fallback/Legacy Support -->
  <noscript>
    <div class="flex items-center justify-center h-screen">
      <div class="text-center">
        <h1 class="text-2xl font-bold text-primary-400 mb-4">LCC.js</h1>
        <p class="text-secondary-300">JavaScript is required to run this application.</p>
      </div>
    </div>
  </noscript>

  <!-- Hidden file inputs for legacy support -->
  <input type="file" id="file-input" style="display: none;" accept=".a,.e,.o,.lst,.bst,.txt">
  
  <!-- Web Worker initialization -->
  <script>
    // Initialize Web Worker for background processing
    if (typeof(Worker) !== "undefined") {
      window.worker = new Worker('./worker.js');
      console.log('Web Worker initialized');
    } else {
      console.error('Web Workers are not supported in this browser');
    }
    
    // Initialize CodeMirror for legacy support
    window.addEventListener('DOMContentLoaded', function() {
      if (!document.getElementById('react-root').hasChildNodes()) {
        // Fallback to legacy mode if React doesn't load
        console.log('React not loaded, falling back to legacy mode');
        // You could load the old main.js here as fallback
      }
    });
  </script>
</body>

</html>
