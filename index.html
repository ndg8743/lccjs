<!DOCTYPE html>
<html lang="en" class="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LCC.js - JavaScript-based Assembler and Interpreter</title>
  
  <!-- CodeMirror -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/6.65.7/codemirror.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/6.65.7/codemirror.min.js"></script>
  
  <!-- Our bundled scripts -->
  <script src="./dist/bundle.js" defer></script>
  <script src="./dist/main.js" type="module" defer></script>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            primary: {
              50: '#f0f9ff',
              100: '#e0f2fe',
              200: '#bae6fd',
              300: '#7dd3fc',
              400: '#38bdf8',
              500: '#0ea5e9',
              600: '#0284c7',
              700: '#0369a1',
              800: '#075985',
              900: '#0c4a6e',
              950: '#082f49',
            },
            secondary: {
              50: '#f8fafc',
              100: '#f1f5f9',
              200: '#e2e8f0',
              300: '#cbd5e1',
              400: '#94a3b8',
              500: '#64748b',
              600: '#475569',
              700: '#334155',
              800: '#1e293b',
              900: '#0f172a',
              950: '#020617',
            },
          },
        },
      },
    }
  </script>
  
  <!-- Custom CSS -->
  <link rel="stylesheet" href="styles.css">
  
  <!-- Font Awesome for icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body class="bg-secondary-900 text-secondary-100 min-h-screen">
  <div id="app" class="flex flex-col h-screen">
    <!-- Header -->
    <header class="bg-secondary-800 shadow-md">
      <div class="container mx-auto px-4 py-3 flex justify-between items-center">        <div class="flex items-center space-x-4">
          <h1 class="text-xl font-bold text-primary-400">LCC.js</h1>
          <div class="hidden md:flex space-x-3">
            <button id="btn-run" class="btn btn-primary text-sm">
              <i class="fas fa-play mr-1"></i> Run Program
            </button>
            <button id="btn-load-demo" class="btn btn-secondary text-sm">
              <i class="fas fa-file-code mr-1"></i> Load Demo
            </button>
          </div>
        </div>        <div class="flex items-center space-x-3">
          <button id="btn-theme-toggle" class="btn btn-secondary text-sm">
            <i class="fas fa-sun"></i>
          </button>
          <!-- Hamburger Menu Button -->
          <button id="hamburger-menu-btn" class="btn btn-secondary text-sm">
            <i class="fas fa-bars"></i>
          </button>
        </div>
      </div>
    </header>    <!-- Hamburger Menu Dropdown -->
    <div id="hamburger-menu" class="hamburger-menu">
      <div class="hamburger-menu-section">
        <h3 class="hamburger-menu-section-title">File Operations</h3>
      </div>
      <div class="p-2">
        <button id="btn-new" class="hamburger-menu-item">
          <i class="fas fa-file"></i> New File
        </button>
        <button id="btn-open" class="hamburger-menu-item">
          <i class="fas fa-folder-open"></i> Open File
        </button>
        <button id="btn-save" class="hamburger-menu-item">
          <i class="fas fa-save"></i> Save File
        </button>
        <button id="btn-load-demo-mobile" class="hamburger-menu-item">
          <i class="fas fa-file-code"></i> Load a1test.a
        </button>
      </div>
      <div class="hamburger-menu-section">
        <h3 class="hamburger-menu-section-title">Download Options</h3>
      </div>
      <div class="p-2">
        <button data-format="a" class="hamburger-menu-item download-format-btn">
          <i class="fas fa-download"></i> Assembly (.a)
        </button>
        <button data-format="lst" class="hamburger-menu-item download-format-btn">
          <i class="fas fa-download"></i> Listing (.lst)
        </button>
        <button data-format="bst" class="hamburger-menu-item download-format-btn">
          <i class="fas fa-download"></i> Binary (.bst)
        </button>
        <button data-format="e" class="hamburger-menu-item download-format-btn">
          <i class="fas fa-download"></i> Executable (.e)
        </button>
        <button id="btn-download-all" class="hamburger-menu-item">
          <i class="fas fa-file-archive"></i> Download All as TXT
        </button>
      </div>
      <div class="hamburger-menu-section">
        <h3 class="hamburger-menu-section-title">Editor Options</h3>
      </div>
      <div class="p-2">
        <button id="btn-toggle-error" class="hamburger-menu-item">
          <i class="fas fa-times-circle text-red-500"></i> Toggle Error Checking
        </button>
        <button id="btn-toggle-warning" class="hamburger-menu-item">
          <i class="fas fa-exclamation-triangle text-yellow-500"></i> Toggle Warning Checking
        </button>
        <button id="btn-toggle-info" class="hamburger-menu-item">
          <i class="fas fa-info-circle text-blue-500"></i> Toggle Info Checking
        </button>
      </div>
    </div>    <!-- Main Content -->
    <main class="flex-1 container mx-auto px-4 py-4 flex flex-col md:flex-row gap-4 overflow-hidden">
      <!-- Left Panel: Editor -->
      <div class="flex-1 flex flex-col min-h-0 md:max-h-full">
        <div class="flex justify-between items-center mb-2">
          <h2 class="text-lg font-semibold text-primary-400">Editor</h2>
          <div class="md:hidden flex">
            <button id="btn-run-mobile" class="btn btn-primary text-sm">
              <i class="fas fa-play mr-1"></i> Run
            </button>
          </div>
        </div>
        <div id="editor-container" class="flex-1 overflow-hidden rounded-xl border border-secondary-700 bg-secondary-800 shadow-lg"></div>
      </div>

      <!-- Right Panel: Terminal -->
      <div class="flex-1 flex flex-col min-h-0 md:max-h-full">
        <div class="flex justify-between items-center mb-2">
          <h2 class="text-lg font-semibold text-primary-400">Terminal</h2>
          <div class="flex space-x-2">
            <button id="btn-clear" class="btn btn-secondary text-sm">
              <i class="fas fa-trash-alt mr-1"></i> Clear
            </button>
          </div>
        </div>
        <!-- Unified Terminal -->
        <div class="flex-1 flex flex-col min-h-0 rounded-xl border border-secondary-700 bg-secondary-900 overflow-hidden shadow-lg">
          <div id="terminal" class="terminal">
            <!-- Terminal output will be appended here -->
          </div>
          <div class="border-t border-secondary-700 p-2 flex">
            <input id="terminal-input" type="text" placeholder="Type here and press Enter" class="terminal-input" autocomplete="off" />
          </div>
        </div>
      </div>
    </main>

    <!-- Command Palette (hidden by default) -->
    <div id="command-palette" class="command-palette hidden">
      <input id="command-palette-input" type="text" class="command-palette-input" placeholder="Type a command...">
      <div id="command-palette-results" class="command-palette-results"></div>
    </div>
  </div>

  <!-- File input (hidden) -->
  <input type="file" id="file-input" accept=".a,.bin,.lst,.bst" class="hidden">  <script>
    // Initialize dark mode based on user preference
    const isDarkMode = localStorage.getItem('darkMode') === 'true' || 
                      (!localStorage.getItem('darkMode') && window.matchMedia('(prefers-color-scheme: dark)').matches);
    
    if (isDarkMode) {
      document.documentElement.classList.add('dark');
      document.body.classList.add('bg-secondary-900');
      document.body.classList.add('text-secondary-100');
    } else {
      document.documentElement.classList.remove('dark');
      document.body.classList.remove('bg-secondary-900');
      document.body.classList.add('bg-secondary-100');
      document.body.classList.remove('text-secondary-100');
      document.body.classList.add('text-secondary-900');
    }

    // Load a1test.a by default
    const a1testContent = `; a1test.a
s:        lea r0, c6
          st r0, ac6
          lea r0, c7
          st r0, ac7
          ld r0, x
          dout r0        ; 1   (dout equivalent to dout r0)
          nl
          add r0, r0, r0
          dout r0        ; 2
          nl
          add r0, r0, 1
          dout r0        ; 3
          nl 
          add r0, r0, 3
          and r0, r0, 4
          dout r0        ; 4
          nl
          br L1
          halt
L1:       
          brp L2
          halt
L2:        
ABC:
          add r1, r0, 0
          not r1, r1
          brn L3
          halt
L3:       br L4 
x:        .word 1
L4:       and r2, r2, 0
          brz L5
          halt
          .zero 3
L5:       lea r3, L6
          jmp r3
          halt
L6:       bl r1sub       ; 5
          lea r4, r2sub
          blr r4         ; 6
          ld r0, ac7
          ldr r0, r0, 0
          dout r0        ; 7
          nl
          lea r4, c6
          ldr r0, r4, 4
          dout r0        ; 8
          nl
          ld  r5, minus
          not r0, r5 
          dout r0        ; -9
          nl
          add r0, r0, -1
          st r0, save
          ld r0, save
          dout r0        ; -10
          nl
          add r0, r0, -1
          ld r1, ac7
          str r0, r1, 0
          ld  r0, c7
          dout r0        ; -11
          nl
          add r0, r0, -1
          lea r1, save
          str r0, r1, 1
          ld  r0, save2
          dout r0        ; -12
          nl
          halt
          ; hello

r1sub:    ld r0, c5
          dout r0        ; 5
          nl
          ret
c5:       .word 5
minus:    .word 8
r2sub:    ld r0, c6
          dout r0
          nl
          ret
c6:       .word 6        ; .word equivalent to .fill
c7:       .word 7
ac6:      .word 0          
ac7:      .word 0
c8:       .word 8
save:     .word -5
save2:    .word 100`;

    // Initialize editor with LCC mode
    const editor = CodeMirror(document.getElementById("editor-container"), {
      value: a1testContent,
      mode: "lcc",
      theme: "lcc-dark",
      lineNumbers: true,
      indentUnit: 4,
      tabSize: 4,
      indentWithTabs: true,
      lineWrapping: true,
      gutters: ["CodeMirror-linenumbers", "CodeMirror-foldgutter", "CodeMirror-lint-markers"],
      autoCloseBrackets: true,
      matchBrackets: true,
      foldGutter: true,
      extraKeys: {
        "Ctrl-Space": "autocomplete",
        "Ctrl-S": function(cm) {
          document.getElementById("btn-save").click();
        }
      }
    });

    // Make editor available globally
    window.editor = editor;

    // Adjust editor height
    function adjustEditorHeight() {
      const editorContainer = document.getElementById('editor-container');
      if (editorContainer) {
        const editorWrapper = editorContainer.querySelector('.CodeMirror');
        if (editorWrapper) {
          editorWrapper.style.height = '100%';
        }
      }
    }
    
    window.addEventListener('resize', adjustEditorHeight);
    adjustEditorHeight();

    // Initialize worker
    let randomnumber = Math.floor(Math.random() * 1000000); 
    let worker = new Worker("./worker.js" + "?v=" + randomnumber);
    window.worker = worker;

    // Check if SharedArrayBuffer is supported
    let inputBuffer, inputIndex, inputView, indexView;
    
    try {
      // Create Shared Buffers if supported
      inputBuffer = new SharedArrayBuffer(256);
      inputIndex = new SharedArrayBuffer(4);
      
      worker.postMessage({
        inputBuffer: inputBuffer,
        inputIndex: inputIndex
      });
      
      inputView = new Uint8Array(inputBuffer);
      indexView = new Int32Array(inputIndex);
      
      console.log("SharedArrayBuffer is supported");
    } catch (e) {
      console.warn("SharedArrayBuffer is not supported. Using fallback mechanism.", e);
      
      worker.postMessage({
        type: "fallback",
        payload: { useMessagePassing: true }
      });
    }

    // Store shared buffer references globally
    window.inputView = inputView;
    window.indexView = indexView;
    window.worker = worker;
  </script>

  <!-- Tooltip transparency fix -->
  <script type="module">
    // Import and initialize tooltip fixer
    import { initializeTooltipFixer } from './src/tooltip-fix.js';
    
    // Initialize tooltip fixer immediately
    initializeTooltipFixer();
    
    // Also run after a short delay to catch any delayed tooltip creation
    setTimeout(initializeTooltipFixer, 1000);
  </script>
</body>

</html>
